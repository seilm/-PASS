<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보고PASS — 결재 대기열 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F6F7F9; font-family: 'Noto Sans KR', -apple-system, sans-serif; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #D9DEE7; border-radius: 3px; }
</style>

<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script>
(function () {
  function prefixed(key, shared) {
    return (shared ? "bogopass_shared_" : "bogopass_local_") + key;
  }
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem(prefixed(key, shared));
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem(prefixed(key, shared), value);
        return { key, value, shared: !!shared };
      } catch (e) {
        console.error("storage set failed", e);
        return null;
      }
    },
    async delete(key, shared) {
      try {
        localStorage.removeItem(prefixed(key, shared));
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async list(prefix, shared) {
      const p = prefixed(prefix || "", shared);
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(p));
      return { keys, prefix, shared: !!shared };
    },
  };
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;


/* ============================================================
   보고PASS — 실제 작동하는 대기열 관리 앱
   - shared storage: approvers, queue (모든 사용자가 같은 데이터를 봄)
   - personal storage: 즐겨찾기, 마지막 선택한 내 결재자 계정
   ============================================================ */

const NAVY = "#172033";
const NAVY2 = "#334E68";
const NAVY_DEEP = "#101827";
const CREAM = "#FFFFFF";
const ORANGE = "#FF7A45";
const ORANGE_DEEP = "#E85F2A";
const GREEN = "#2E8B72";
const RED = "#D95C52";

const DAYS = ["월", "화", "수", "목", "금"];

const SEED_APPROVERS = [
  {
    id: "app_1",
    name: "이수현",
    role: "상무",
    dept: "전략기획실",
    status: "가능", // 가능 | 일시중단 | 불가
    weekly: { 월: ["오전", "오후"], 화: ["오후"], 수: [], 목: ["오전", "오후"], 금: ["오전"] },
  },
  {
    id: "app_2",
    name: "박준영",
    role: "팀장",
    dept: "재무팀",
    status: "가능",
    weekly: { 월: ["오전", "오후"], 화: ["오전", "오후"], 수: ["오전"], 목: ["오후"], 금: ["오전", "오후"] },
  },
  {
    id: "app_3",
    name: "정하늘",
    role: "전무",
    dept: "임원",
    status: "불가",
    weekly: { 월: [], 화: ["오후"], 수: ["오후"], 목: ["오전"], 금: [] },
  },
  {
    id: "app_4",
    name: "김도윤",
    role: "대표",
    dept: "임원",
    status: "가능",
    weekly: { 월: ["오전"], 화: ["오전"], 수: ["오전", "오후"], 목: ["오전", "오후"], 금: ["오전"] },
  },
];

function uid(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 9);
}

function useStorage() {
  const [ready, setReady] = useState(false);
  const [approvers, setApprovers] = useState([]);
  const [queue, setQueue] = useState([]); // all waiting items across all approvers
  const pollRef = useRef(null);

  const loadAll = useCallback(async () => {
    try {
      let approversData;
      try {
        const r = await window.storage.get("approvers", true);
        approversData = r ? JSON.parse(r.value) : null;
      } catch (e) {
        approversData = null;
      }
      if (!approversData) {
        approversData = SEED_APPROVERS;
        await window.storage.set("approvers", JSON.stringify(approversData), true);
      }
      setApprovers(approversData);

      let queueData;
      try {
        const r = await window.storage.get("queue", true);
        queueData = r ? JSON.parse(r.value) : null;
      } catch (e) {
        queueData = null;
      }
      if (!queueData) {
        queueData = [];
        await window.storage.set("queue", JSON.stringify(queueData), true);
      }
      setQueue(queueData);
      setReady(true);
    } catch (e) {
      console.error("storage load error", e);
      setApprovers(SEED_APPROVERS);
      setQueue([]);
      setReady(true);
    }
  }, []);

  useEffect(() => {
    loadAll();
    pollRef.current = setInterval(loadAll, 4000);
    return () => clearInterval(pollRef.current);
  }, [loadAll]);

  const saveApprovers = useCallback(async (next) => {
    setApprovers(next);
    try {
      await window.storage.set("approvers", JSON.stringify(next), true);
    } catch (e) {
      console.error("save approvers failed", e);
    }
  }, []);

  const saveQueue = useCallback(async (next) => {
    setQueue(next);
    try {
      await window.storage.set("queue", JSON.stringify(next), true);
    } catch (e) {
      console.error("save queue failed", e);
    }
  }, []);

  return { ready, approvers, queue, saveApprovers, saveQueue, reload: loadAll };
}

function StatusBadge({ status }) {
  const map = {
    가능: { bg: "#EAF6F2", fg: "#2E7048", label: "가능" },
    일시중단: { bg: "#FFF1EA", fg: ORANGE_DEEP, label: "일시중단" },
    불가: { bg: "#FCECE9", fg: RED, label: "불가" },
  };
  const s = map[status] || map["가능"];
  return (
    <span
      style={{
        background: s.bg,
        color: s.fg,
        fontSize: 11,
        fontWeight: 700,
        padding: "3px 9px",
        borderRadius: 8,
      }}
    >
      {s.label}
    </span>
  );
}

function Avatar({ name, size = 40, tone = "navy" }) {
  const bg = tone === "navy" ? `linear-gradient(135deg, ${NAVY2}, ${NAVY})` : "#E2DED4";
  const fg = tone === "navy" ? "#fff" : NAVY;
  return (
    <div
      style={{
        width: size,
        height: size,
        borderRadius: size * 0.3,
        background: bg,
        color: fg,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontWeight: 700,
        fontSize: size * 0.34,
        flexShrink: 0,
        fontFamily: "'Space Grotesk', sans-serif",
      }}
    >
      {name.slice(0, 2)}
    </div>
  );
}

function waitingListFor(queue, approverId) {
  return queue
    .filter((q) => q.approverId === approverId && q.status === "waiting")
    .sort((a, b) => a.order - b.order);
}

function totalWaitMinutes(list, uptoIndex) {
  let total = 0;
  for (let i = 0; i < uptoIndex; i++) total += list[i].estMinutes;
  return total;
}

// 데모용 AI 예상시간: 입력 예상시간에 과거 보정치를 적용하는 구조를 시각화합니다.
// 실제 운영에서는 보고 유형/결재자/시간대별 실측 데이터를 학습해 이 보정값을 대체합니다.
function aiWaitEstimate(list, uptoIndex) {
  const base = totalWaitMinutes(list, uptoIndex);
  if (base <= 0) return 0;
  return Math.max(1, Math.round(base * 1.1));
}

function orderedWaitingList(queue, approverId) {
  return queue
    .filter((q) => q.approverId === approverId && q.status === "waiting")
    .sort((a, b) => {
      if (a.priorityAt && !b.priorityAt) return -1;
      if (!a.priorityAt && b.priorityAt) return 1;
      if (a.priorityAt && b.priorityAt) return a.priorityAt - b.priorityAt;
      return a.order - b.order;
    });
}

/* ============================================================
   Reporter flow
   ============================================================ */

function ReporterFlow({ approvers, queue, saveQueue, myName, setMyName }) {
  const [step, setStep] = useState("select"); // select -> schedule -> form -> waiting
  const [selectedId, setSelectedId] = useState(null);
  const [favorites, setFavorites] = useState([]);
  const [search, setSearch] = useState("");
  const [content, setContent] = useState("");
  const [formError, setFormError] = useState("");
  const [estMinutes, setEstMinutes] = useState(10);
  const [urgent, setUrgent] = useState(false);
  const [myTicketId, setMyTicketId] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("favorites", false);
        if (r) setFavorites(JSON.parse(r.value));
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    // check if I already have an active ticket
    const mine = queue.find((q) => q.reporter === myName && q.status === "waiting");
    if (mine) {
      setMyTicketId(mine.id);
      setSelectedId(mine.approverId);
      if (step === "select") setStep("waiting");
    } else if (myTicketId) {
      // ticket finished/cancelled
      setMyTicketId(null);
    }
  }, [queue, myName]); // eslint-disable-line

  const toggleFavorite = async (id) => {
    const next = favorites.includes(id) ? favorites.filter((f) => f !== id) : [...favorites, id];
    setFavorites(next);
    try {
      await window.storage.set("favorites", JSON.stringify(next), false);
    } catch (e) {}
  };

  const selected = approvers.find((a) => a.id === selectedId);

  const filtered = approvers.filter(
    (a) =>
      a.name.includes(search) || a.role.includes(search) || a.dept.includes(search)
  );
  const favList = filtered.filter((a) => favorites.includes(a.id));
  const groups = {};
  filtered.forEach((a) => {
    groups[a.dept] = groups[a.dept] || [];
    groups[a.dept].push(a);
  });

  const list = selected ? orderedWaitingList(queue, selected.id) : [];
  const myPos = list.findIndex((q) => q.id === myTicketId);
  const estWait = myPos >= 0 ? aiWaitEstimate(list, myPos) : aiWaitEstimate(list, list.length);

  const today = DAYS[new Date().getDay() - 1] || "월";
  const todaySlots = selected ? selected.weekly[today] || [] : [];

  useEffect(() => {
    const mine = queue.find((q) => q.id === myTicketId);
    if (!mine || mine.status !== "called" || !mine.calledAt) return;
    const timer = setInterval(async () => {
      const fresh = queue.find((q) => q.id === myTicketId);
      if (!fresh || fresh.status !== "called" || !fresh.calledAt) return;
      if (Date.now() - fresh.calledAt < 5 * 60 * 1000) return;
      const sameApprover = waitingListFor(queue, fresh.approverId);
      const maxOrder = sameApprover.length ? Math.max(...sameApprover.map((q) => q.order)) : 0;
      const next = queue.map((q) => q.id === fresh.id
        ? { ...q, status: "waiting", order: maxOrder + 1, calledAt: null, priorityAt: null, skippedAt: Date.now() }
        : q
      );
      await saveQueue(next);
    }, 1000);
    return () => clearInterval(timer);
  }, [queue, myTicketId, saveQueue]);

  const submit = async () => {
    const normalizedContent = String(content || "").trim();
    if (!selected) {
      setFormError("결재자를 먼저 선택해주세요.");
      return;
    }
    if (!normalizedContent) {
      setFormError("보고 내용을 입력해주세요.");
      return;
    }
    if (selected.status !== "가능") {
      setFormError(selected.status === "일시중단" ? "현재 결재자가 일시중단 상태입니다. 보고 가능 상태가 되면 등록해주세요." : "오늘은 해당 결재자에게 보고를 등록할 수 없습니다.");
      return;
    }
    const currentList = waitingListFor(queue, selected.id);
    const maxOrder = currentList.length ? Math.max(...currentList.map((q) => q.order)) : 0;
    const ticket = {
      id: uid("ticket"),
      approverId: selected.id,
      reporter: myName,
      content: normalizedContent,
      estMinutes,
      urgent,
      order: maxOrder + 1,
      status: "waiting",
      createdAt: Date.now(),
      calledAt: null,
      startedAt: null,
      priorityAt: null,
    };
    const next = [...queue, ticket];
    await saveQueue(next);
    setMyTicketId(ticket.id);
    setFormError("");
    setStep("waiting");
  };

  const cancelTicket = async () => {
    const next = queue.filter((q) => q.id !== myTicketId);
    await saveQueue(next);
    setMyTicketId(null);
    setStep("select");
    setSelectedId(null);
    setContent("");
  };

  const confirmGoingNow = async () => {
    const next = queue.map((q) =>
      q.id === myTicketId ? { ...q, status: "in_progress", startedAt: Date.now() } : q
    );
    await saveQueue(next);
  };

  const finishAndNext = async () => {
    const next = queue.filter((q) => q.id !== myTicketId);
    await saveQueue(next);
    setMyTicketId(null);
    setSelectedId(null);
    setContent("");
    setFormError("");
    setStep("select");
  };

  const pushBackOrder = async () => {
    if (!selected) return;
    const currentList = waitingListFor(queue, selected.id);
    const maxOrder = currentList.length ? Math.max(...currentList.map((q) => q.order)) : 0;
    const next = queue.map((q) => (q.id === myTicketId ? { ...q, order: maxOrder + 1 } : q));
    await saveQueue(next);
  };

  /* ---- STEP: select approver ---- */
  if (step === "select") {
    return (
      <div style={pageStyle}>
        <div style={headerBand}>
          <div style={{ fontSize: 12, color: ORANGE, fontWeight: 700, letterSpacing: 1 }}>
            보고자
          </div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#fff", marginTop: 4 }}>
            결재자 선택
          </div>
          <div style={{ fontSize: 12.5, color: "#C9D3DE", marginTop: 4 }}>
            보고할 대상을 검색하거나 즐겨찾기에서 선택하세요
          </div>
          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="이름, 직책, 부서로 검색"
            style={searchInput}
          />
        </div>

        <div style={bodyStyle}>
          {favList.length > 0 && (
            <>
              <SectionTitle>즐겨찾기</SectionTitle>
              <div style={{ display: "flex", gap: 10, overflowX: "auto", paddingBottom: 8, marginBottom: 20 }}>
                {favList.map((a) => (
                  <div
                    key={a.id}
                    onClick={() => setSelectedId(a.id)}
                    style={{
                      flexShrink: 0,
                      width: 84,
                      background: "#fff",
                      border: `1.5px solid ${selectedId === a.id ? ORANGE : "#E4E2DC"}`,
                      borderRadius: 14,
                      padding: 12,
                      textAlign: "center",
                      cursor: "pointer",
                    }}
                  >
                    <Avatar name={a.name} size={38} />
                    <div style={{ fontSize: 11.5, fontWeight: 700, color: NAVY, marginTop: 6 }}>{a.name}</div>
                    <div style={{ fontSize: 9.5, color: "#9A9689" }}>{a.role}</div>
                  </div>
                ))}
              </div>
            </>
          )}

          {Object.entries(groups).map(([dept, list]) => (
            <div key={dept} style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#B0ABA0", marginBottom: 8 }}>{dept}</div>
              <div style={{ background: "#fff", borderRadius: 14, border: "1px solid #E4E2DC", overflow: "hidden" }}>
                {list.map((a, i) => (
                  <div
                    key={a.id}
                    onClick={() => setSelectedId(a.id)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 12,
                      padding: "12px 14px",
                      borderBottom: i < list.length - 1 ? "1px solid #EFEDE7" : "none",
                      cursor: "pointer",
                      background: selectedId === a.id ? "#FFF1EA" : "transparent",
                    }}
                  >
                    <Avatar name={a.name} size={36} tone="cream" />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: NAVY }}>{a.name}</div>
                      <div style={{ fontSize: 11, color: "#9A9689" }}>
                        {a.role} · {a.dept}
                      </div>
                    </div>
                    <StatusBadge status={a.status} />
                    <div
                      onClick={(e) => {
                        e.stopPropagation();
                        toggleFavorite(a.id);
                      }}
                      style={{ fontSize: 18, color: favorites.includes(a.id) ? ORANGE : "#D3CFC4", padding: 4 }}
                    >
                      {favorites.includes(a.id) ? "★" : "☆"}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}

          <button
            disabled={!selected}
            onClick={() => setStep("schedule")}
            style={{ ...primaryBtn, opacity: selected ? 1 : 0.4, marginTop: 8 }}
          >
            {selected ? `${selected.name} 선택 완료 → 일정 확인` : "결재자를 선택하세요"}
          </button>
        </div>
      </div>
    );
  }

  /* ---- STEP: schedule check ---- */
  if (step === "schedule" && selected) {
    return (
      <div style={pageStyle}>
        <TopBar title="결재자 일정 확인" onBack={() => setStep("select")} />
        <div style={bodyStyle}>
          <div style={profileCard}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <Avatar name={selected.name} size={46} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#fff" }}>
                  {selected.name} {selected.role}
                </div>
                <div style={{ fontSize: 11.5, color: "#C9D3DE" }}>{selected.dept}</div>
              </div>
              <div>
                <div
                  style={{
                    fontSize: 11,
                    fontWeight: 700,
                    color: "#fff",
                    background:
                      selected.status === "가능" ? "rgba(62,142,90,0.35)" : "rgba(196,72,58,0.35)",
                    border: `1px solid ${selected.status === "가능" ? GREEN : RED}`,
                    padding: "5px 10px",
                    borderRadius: 9,
                  }}
                >
                  {selected.status === "가능" ? "지금 보고 가능" : selected.status === "일시중단" ? "잠시 후 가능" : "오늘 보고 불가"}
                </div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
              <MiniStat num={list.length} label="현재 대기 인원" />
              <MiniStat num={waitingListFor(queue, selected.id).reduce((s, q) => s + q.estMinutes, 0) + "분"} label="누적 대기시간" />
              <MiniStat num={todaySlots.length > 0 ? "가능" : "불가"} label={"오늘(" + today + ") 상태"} />
            </div>
          </div>

          <SectionTitle>이번 주 일정</SectionTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {DAYS.map((d) => {
              const slots = selected.weekly[d] || [];
              const isToday = d === today;
              return (
                <div
                  key={d}
                  style={{
                    background: isToday ? "#fff" : "#F7F5F0",
                    border: isToday ? `1.5px solid ${NAVY2}` : "1px solid #E4E2DC",
                    borderRadius: 12,
                    padding: "12px 14px",
                    display: "flex",
                    alignItems: "center",
                    gap: 12,
                  }}
                >
                  <div
                    style={{
                      width: 36,
                      height: 36,
                      borderRadius: 10,
                      background: isToday ? `linear-gradient(135deg, ${NAVY2}, ${NAVY})` : "#E2DED4",
                      color: isToday ? "#fff" : NAVY,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontWeight: 700,
                      fontSize: 13,
                    }}
                  >
                    {d}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: NAVY }}>
                      {d}요일 {isToday && "· 오늘"}
                    </div>
                    <div style={{ fontSize: 11, color: "#9A9689" }}>
                      {slots.length === 0 ? "보고 불가" : slots.join(" · ") + " 보고 가능"}
                    </div>
                  </div>
                  <span
                    style={{
                      fontSize: 10,
                      fontWeight: 700,
                      padding: "4px 9px",
                      borderRadius: 8,
                      background: slots.length ? "#EAF6F2" : "#F0EDE4",
                      color: slots.length ? "#2E7048" : "#A6A192",
                    }}
                  >
                    {slots.length ? "가능" : "불가"}
                  </span>
                </div>
              );
            })}
          </div>

          <button onClick={() => setStep("form")} style={{ ...primaryBtn, marginTop: 20 }}>
            이 결재자에게 보고 등록하기
          </button>
        </div>
      </div>
    );
  }

  /* ---- STEP: form ---- */
  if (step === "form" && selected) {
    const currentList = waitingListFor(queue, selected.id);
    const previewOrder = currentList.length + 1;
    const previewWait = currentList.reduce((s, q) => s + q.estMinutes, 0);
    return (
      <div style={pageStyle}>
        <TopBar title="보고 정보 입력" onBack={() => setStep("schedule")} />
        <div style={bodyStyle}>
          <div style={targetCard}>
            <Avatar name={selected.name} size={44} />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 15.5, fontWeight: 700, color: "#fff" }}>
                {selected.name} {selected.role}
              </div>
              <div style={{ fontSize: 11.5, color: "#C9D3DE" }}>
                {selected.dept} · 현재 대기 {currentList.length}명
              </div>
            </div>
          </div>

          <FieldLabel>보고 내용 *</FieldLabel>
          <textarea
            value={content}
            onChange={(e) => { setContent(e.target.value.slice(0, 100)); setFormError(""); }}
            placeholder="예: 신규 파트너십 제안 검토 결과 공유"
            style={textareaStyle}
          />
          <div style={{ textAlign: "right", fontSize: 10.5, color: "#B0ABA0", marginBottom: 20 }}>
            {content.length} / 100자
          </div>

          <FieldLabel>예상 보고 시간 *</FieldLabel>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 20 }}>
            {[5, 10, 15, 20].map((m) => (
              <button
                key={m}
                onClick={() => setEstMinutes(m)}
                style={{ ...pillBtn, ...(estMinutes === m ? pillBtnActive : {}) }}
              >
                {m}분
              </button>
            ))}
          </div>

          <FieldLabel>긴급도</FieldLabel>
          <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
            <button
              onClick={() => setUrgent(false)}
              style={{ ...urgencyBtn, ...(!urgent ? urgencyNormalActive : {}) }}
            >
              🔵 일반 보고
            </button>
            <button
              onClick={() => setUrgent(true)}
              style={{ ...urgencyBtn, ...(urgent ? urgencyUrgentActive : {}) }}
            >
              🟠 긴급 보고
            </button>
          </div>

          {formError && (
            <div style={{ background: "#FCECE9", border: `1px solid ${RED}55`, color: RED, borderRadius: 10, padding: "10px 12px", fontSize: 12, marginBottom: 12 }}>
              ⚠️ {formError}
            </div>
          )}

          <div style={previewCard}>
            <div style={{ fontSize: 11.5, fontWeight: 700, color: "#9A9689", marginBottom: 10 }}>
              대기 등록 미리보기
            </div>
            <PreviewRow k="현재 대기 순번" v={previewOrder + "번째"} />
            <PreviewRow k="예상 대기 시간" v={"약 " + previewWait + "분"} orange />
          </div>

          <button
            disabled={!String(content || "").trim() || selected.status !== "가능"}
            onClick={submit}
            style={{ ...primaryBtn, opacity: String(content || "").trim() && selected.status === "가능" ? 1 : 0.4 }}
          >
            {selected.status === "불가" ? "오늘 보고 접수 불가" : selected.status === "일시중단" ? "잠시 후 보고 접수 가능" : "웨이팅 시작하기"}
          </button>
        </div>
      </div>
    );
  }

  /* ---- STEP: waiting ---- */
  if (step === "waiting" && selected) {
    const myTicket = queue.find((q) => q.id === myTicketId);
    const pos = list.findIndex((q) => q.id === myTicketId);
    const waitMin = pos >= 0 ? aiWaitEstimate(list, pos) : 0;
    const wasCalled = myTicket && myTicket.status === "called";
    const callSecondsLeft = wasCalled && myTicket.calledAt
      ? Math.max(0, 300 - Math.floor((Date.now() - myTicket.calledAt) / 1000))
      : 0;
    const inProgress = myTicket && myTicket.status === "in_progress";

    return (
      <div style={pageStyle}>
        <div style={headerBand}>
          <div style={{ fontSize: 11, color: ORANGE, fontWeight: 700, letterSpacing: 1 }}>대기 중</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: "#fff", marginTop: 4 }}>
            {selected.name} {selected.role}
          </div>
          <div style={{ fontSize: 12, color: "#C9D3DE", marginTop: 2 }}>
            {selected.dept} · {pos + 1}번째 결재 순서
          </div>

          {inProgress ? (
            <div style={{ marginTop: 20, fontSize: 20, fontWeight: 700, color: GREEN }}>
              ✓ 보고 진행 중입니다
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "flex-end", gap: 10, marginTop: 18 }}>
              <div style={{ fontSize: 56, fontWeight: 700, color: "#fff", lineHeight: 0.9 }}>{waitMin}</div>
              <div style={{ fontSize: 14, color: "#fff", paddingBottom: 8 }}>분 예상 대기</div>
            </div>
          )}
          <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
            <Chip>현재 순번 {pos + 1}/{list.length}</Chip>
            <Chip>AI 예상 · Queue 실측 보정</Chip>
          </div>
        </div>

        <div style={bodyStyle}>
          <SectionTitle>대기 순서</SectionTitle>
          <div style={{ background: "#fff", borderRadius: 16, border: "1px solid #E4E2DC", overflow: "hidden", marginBottom: 20 }}>
            {list.map((q, i) => (
              <div
                key={q.id}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 12,
                  padding: "12px 16px",
                  borderBottom: i < list.length - 1 ? "1px solid #EFEDE7" : "none",
                  background: q.id === myTicketId ? "#FFF1EA" : "transparent",
                }}
              >
                <div
                  style={{
                    width: 26,
                    height: 26,
                    borderRadius: 8,
                    background: q.id === myTicketId ? ORANGE : "#F0EDE4",
                    color: q.id === myTicketId ? "#fff" : "#9A9689",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    fontWeight: 700,
                    fontSize: 13,
                    flexShrink: 0,
                  }}
                >
                  {i + 1}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11, color: "#A6A192" }}>
                    {q.reporter} {q.id === myTicketId && "(나)"} {q.urgent && "🟠긴급"}
                  </div>
                  <div style={{ fontSize: 13.5, fontWeight: 600, color: NAVY, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {q.content}
                  </div>
                </div>
                <div style={{ fontSize: 11, color: "#A6A192" }}>~{q.estMinutes}분</div>
              </div>
            ))}
          </div>

          {wasCalled && !inProgress && (
            <div style={{ ...cardStyle, marginBottom: 14, borderColor: ORANGE }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: ORANGE_DEEP, marginBottom: 4 }}>
                🔔 결재자가 지금 호출했습니다!
              </div>
              <div style={{ fontSize: 12, color: "#8D8A7E", marginBottom: 6 }}>
                지금 가겠습니다를 눌러 보고를 시작하세요. 5분 내 응답이 없으면 다음 대기자에게 PASS됩니다.
              </div>
              <div style={{ fontSize: 18, fontWeight: 800, color: ORANGE_DEEP, marginBottom: 10 }}>
                응답 가능 시간 {String(Math.floor(callSecondsLeft / 60)).padStart(2, "0")}:{String(callSecondsLeft % 60).padStart(2, "0")}
              </div>
              <button onClick={confirmGoingNow} style={primaryBtn}>
                지금 가겠습니다
              </button>
            </div>
          )}

          {!wasCalled && !inProgress && (
            <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
              <button onClick={pushBackOrder} style={ghostBtn}>
                내 순서 미루기
              </button>
              <button onClick={cancelTicket} style={{ ...ghostBtn, color: RED, borderColor: "#F0D0CB" }}>
                대기 취소
              </button>
            </div>
          )}

          {inProgress && (
            <button onClick={finishAndNext} style={primaryBtn}>
              보고 완료 · 다음 결재자 선택
            </button>
          )}
        </div>
      </div>
    );
  }

  return null;
}

/* ============================================================
   Approver flow
   ============================================================ */

function ApproverFlow({ approvers, queue, saveApprovers, saveQueue, myApproverId, setMyApproverId }) {
  const [tab, setTab] = useState("queue"); // queue | schedule

  const me = approvers.find((a) => a.id === myApproverId) || approvers[0];
  const myQueue = me ? orderedWaitingList(queue, me.id) : [];

  const setStatus = async (status) => {
    const next = approvers.map((a) => (a.id === me.id ? { ...a, status } : a));
    await saveApprovers(next);
  };

  const callTicket = async (ticketId, priority = false) => {
    const now = Date.now();
    const next = queue.map((q) => (q.id === ticketId
      ? { ...q, status: "called", calledAt: now, priorityAt: priority ? now : q.priorityAt || null }
      : q
    ));
    await saveQueue(next);
  };

  useEffect(() => {
    const called = myQueue.find((q) => q.status === "called" && q.calledAt);
    if (!called) return;
    const timer = setInterval(async () => {
      const fresh = queue.find((q) => q.id === called.id);
      if (!fresh || fresh.status !== "called" || !fresh.calledAt) return;
      if (Date.now() - fresh.calledAt < 5 * 60 * 1000) return;
      const current = orderedWaitingList(queue, me.id).filter((q) => q.id !== fresh.id);
      const maxOrder = current.length ? Math.max(...current.map((q) => q.order)) : 0;
      const nextWaiting = current[0];
      let next = queue.map((q) => q.id === fresh.id
        ? { ...q, status: "waiting", order: maxOrder + 1, calledAt: null, priorityAt: null, skippedAt: Date.now() }
        : q
      );
      if (nextWaiting) {
        next = next.map((q) => q.id === nextWaiting.id
          ? { ...q, status: "called", calledAt: Date.now() }
          : q
        );
      }
      await saveQueue(next);
    }, 1000);
    return () => clearInterval(timer);
  }, [queue, myQueue, me.id, saveQueue]);

  const pushBack = async (ticketId) => {
    const maxOrder = Math.max(...myQueue.map((q) => q.order));
    const next = queue.map((q) => (q.id === ticketId ? { ...q, order: maxOrder + 1, priorityAt: null } : q));
    await saveQueue(next);
  };

  const toggleSlot = async (day, slot) => {
    const current = me.weekly[day] || [];
    const nextSlots = current.includes(slot) ? current.filter((s) => s !== slot) : [...current, slot];
    const next = approvers.map((a) =>
      a.id === me.id ? { ...a, weekly: { ...a.weekly, [day]: nextSlots } } : a
    );
    await saveApprovers(next);
  };

  if (!me) return null;

  return (
    <div style={pageStyle}>
      <div style={headerBand}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <Avatar name={me.name} size={40} />
          <div style={{ flex: 1 }}>
            <select
              value={myApproverId}
              onChange={(e) => setMyApproverId(e.target.value)}
              style={{
                background: "transparent",
                border: "none",
                color: "#fff",
                fontSize: 16,
                fontWeight: 700,
                fontFamily: "inherit",
              }}
            >
              {approvers.map((a) => (
                <option key={a.id} value={a.id} style={{ color: "#000" }}>
                  {a.name} {a.role}
                </option>
              ))}
            </select>
            <div style={{ fontSize: 11.5, color: "#C9D3DE" }}>{me.dept}</div>
          </div>
        </div>

        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          {["불가", "일시중단", "가능"].map((s) => (
            <button
              key={s}
              onClick={() => setStatus(s)}
              style={{
                ...statusToggleBtn,
                ...(me.status === s ? statusToggleActive(s) : {}),
              }}
            >
              {s === "불가" ? "🔴" : s === "일시중단" ? "🟡" : "🟢"} {s}
            </button>
          ))}
        </div>

        <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
          <MiniStat num={myQueue.length} label="오늘 대기 중" />
          <MiniStat num={myQueue.reduce((s, q) => s + q.estMinutes, 0)} label="예상 처리시간(분)" />
          <MiniStat num={myQueue.filter((q) => q.urgent).length} label="긴급 보고" />
        </div>
      </div>

      <div style={{ display: "flex", background: "#fff", borderBottom: "1px solid #E4E2DC" }}>
        {[
          { k: "queue", label: "대기 목록" },
          { k: "schedule", label: "주간 일정" },
        ].map((t) => (
          <div
            key={t.k}
            onClick={() => setTab(t.k)}
            style={{
              flex: 1,
              textAlign: "center",
              padding: "12px 0",
              fontSize: 13,
              fontWeight: 700,
              color: tab === t.k ? ORANGE_DEEP : "#9A9689",
              borderBottom: tab === t.k ? `2px solid ${ORANGE}` : "2px solid transparent",
              cursor: "pointer",
            }}
          >
            {t.label}
          </div>
        ))}
      </div>

      <div style={bodyStyle}>
        {tab === "queue" && (
          <>
            {me.status === "일시중단" && (
              <div style={{ background: "#FFF1EA", border: `1px solid ${ORANGE}55`, borderRadius: 13, padding: "11px 13px", marginBottom: 14, color: ORANGE_DEEP, fontSize: 12, fontWeight: 700 }}>
                ⏸ 보고 대기시간이 일시 정지되었습니다. <span style={{ fontWeight: 500 }}>보고 가능으로 전환하면 다시 진행됩니다.</span>
              </div>
            )}
            {myQueue.length > 0 && (
              <div style={{ background: "#F7F9FC", border: `1px solid ${NAVY2}22`, borderRadius: 14, padding: "12px 14px", marginBottom: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: 11, color: NAVY2, fontWeight: 800 }}>AI 예상 대기시간</div>
                    <div style={{ fontSize: 24, color: NAVY, fontWeight: 700, marginTop: 2 }}>{aiWaitEstimate(myQueue, myQueue.length)}분</div>
                  </div>
                  <div style={{ fontSize: 10.5, color: "#77736A", textAlign: "right", lineHeight: 1.5 }}>Queue 입력값을 기반으로<br/>실측 데이터 보정 예정</div>
                </div>
              </div>
            )}
            {myQueue.length === 0 && (
              <div style={{ textAlign: "center", padding: "40px 0", color: "#B0ABA0", fontSize: 13 }}>
                현재 대기 중인 보고가 없습니다.
              </div>
            )}
            {myQueue.map((q, i) => {
              const isTop = i === 0;
              const isPriority = !!q.priorityAt;
              const isCalled = q.status === "called";
              const isInProgress = q.status === "in_progress";
              return (
                <div
                  key={q.id}
                  style={{
                    background: "#fff",
                    borderRadius: 16,
                    border: `1.5px solid ${isTop ? GREEN : "#E4E2DC"}`,
                    padding: "14px 16px",
                    marginBottom: 10,
                  }}
                >
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <div
                        style={{
                          width: 24,
                          height: 24,
                          borderRadius: 7,
                          background: isTop ? GREEN : "#F0EDE4",
                          color: isTop ? "#fff" : "#9A9689",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          fontWeight: 700,
                          fontSize: 12,
                        }}
                      >
                        {i + 1}
                      </div>
                      <div>
                        <div style={{ fontSize: 11.5, color: "#A6A192" }}>
                          {q.reporter} {q.urgent && "🟠긴급"}
                        </div>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    {isPriority && <span style={{ fontSize: 10, fontWeight: 800, color: ORANGE_DEEP, background: "#FFF1EA", padding: "4px 7px", borderRadius: 7 }}>우선 PASS</span>}
                    <span
                      style={{
                        fontSize: 11,
                        fontWeight: 700,
                        color: isInProgress ? GREEN : isCalled ? ORANGE_DEEP : ORANGE_DEEP,
                        background: isInProgress ? "#EAF6F2" : "#FFF1EA",
                        padding: "4px 8px",
                        borderRadius: 8,
                      }}
                    >
                      {isInProgress ? "보고 진행 중" : isCalled ? "호출됨" : "대기중"}
                    </span>
                    </div>
                  </div>
                  <div style={{ fontSize: 13, color: "#5C5748", marginTop: 8 }}>{q.content}</div>
                  <div style={{ fontSize: 11, color: "#A6A192", marginTop: 6 }}>
                    예상 소요 {q.estMinutes}분
                  </div>
                  {!isCalled && !isInProgress && (
                    <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                      <button onClick={() => callTicket(q.id, true)} style={{ ...callBtn, background: `linear-gradient(135deg, ${ORANGE}, ${ORANGE_DEEP})` }}>
                        {isTop ? "지금 입장하세요" : "우선 PASS"}
                      </button>
                      <button onClick={() => pushBack(q.id)} style={skipBtn}>
                        뒤로 미루기
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
          </>
        )}

        {tab === "schedule" && (
          <>
            <SectionTitle>요일별 보고 가능 시간</SectionTitle>
            {DAYS.map((d) => {
              const slots = me.weekly[d] || [];
              return (
                <div key={d} style={{ background: "#fff", borderRadius: 14, border: "1px solid #E4E2DC", padding: "12px 14px", marginBottom: 10 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: slots.length >= 0 ? 10 : 0 }}>
                    <div
                      style={{
                        width: 34,
                        height: 34,
                        borderRadius: 10,
                        background: "#E2DED4",
                        color: NAVY,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        fontWeight: 700,
                        fontSize: 12,
                      }}
                    >
                      {d}
                    </div>
                    <div style={{ fontSize: 13.5, fontWeight: 700, color: NAVY }}>{d}요일</div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    {["오전", "오후"].map((slot) => (
                      <button
                        key={slot}
                        onClick={() => toggleSlot(d, slot)}
                        style={{
                          ...slotBtn,
                          ...(slots.includes(slot) ? slotBtnActive : {}),
                        }}
                      >
                        {slot}
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   Root App
   ============================================================ */

function App() {
  const { ready, approvers, queue, saveApprovers, saveQueue } = useStorage();
  const [role, setRole] = useState("reporter"); // reporter | approver
  const [myName] = useState("김대리");
  const [myApproverId, setMyApproverId] = useState("app_1");

  if (!ready) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: NAVY_DEEP, color: "#fff", fontFamily: "sans-serif" }}>
        불러오는 중...
      </div>
    );
  }

  const resetDemo = async () => {
    if (!window.confirm("데모 데이터를 초기 상태로 되돌릴까요?")) return;
    localStorage.removeItem("bogopass_shared_approvers");
    localStorage.removeItem("bogopass_shared_queue");
    localStorage.removeItem("bogopass_local_favorites");
    window.location.reload();
  };

  return (
    <div style={{ minHeight: "100vh", background: "#F6F7F9", display: "flex", justifyContent: "center", padding: "24px 12px" }}>
      <div style={{ width: 400, maxWidth: "100%" }}>
        <div style={{ background: "#172033", border: "1px solid #1B3A63", borderRadius: 12, padding: "10px 14px", marginBottom: 12, fontSize: 11.5, color: "#C9D3DE", lineHeight: 1.5 }}>
          <b style={{ color: "#fff" }}>사용 방법</b> — 보고자 모드에서 결재자를 선택해 보고를 등록한 뒤,
          결재자 모드로 바꿔 같은 대기열을 확인해보세요. 우선 PASS · 5분 자동 Skip · 일시중단 Freeze 데모가 포함되어 있습니다.
          <span onClick={resetDemo} style={{ color: ORANGE, cursor: "pointer", fontWeight: 700, marginLeft: 6 }}>
            [데모 초기화]
          </span>
        </div>
        {/* role switcher */}
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <button
            onClick={() => setRole("reporter")}
            style={{
              flex: 1,
              padding: "10px 0",
              borderRadius: 10,
              border: "none",
              cursor: "pointer",
              fontSize: 12.5,
              fontWeight: 700,
              background: role === "reporter" ? ORANGE : "#1B2E52",
              color: "#fff",
            }}
          >
            보고자 모드
          </button>
          <button
            onClick={() => setRole("approver")}
            style={{
              flex: 1,
              padding: "10px 0",
              borderRadius: 10,
              border: "none",
              cursor: "pointer",
              fontSize: 12.5,
              fontWeight: 700,
              background: role === "approver" ? ORANGE : "#1B2E52",
              color: "#fff",
            }}
          >
            결재자 모드
          </button>
        </div>

        <div style={{ borderRadius: 28, overflow: "hidden", boxShadow: "0 30px 60px rgba(0,0,0,0.5)", border: "6px solid #04101F" }}>
          {role === "reporter" ? (
            <ReporterFlow approvers={approvers} queue={queue} saveQueue={saveQueue} myName={myName} />
          ) : (
            <ApproverFlow
              approvers={approvers}
              queue={queue}
              saveApprovers={saveApprovers}
              saveQueue={saveQueue}
              myApproverId={myApproverId}
              setMyApproverId={setMyApproverId}
            />
          )}
        </div>
        <div style={{ textAlign: "center", fontSize: 10.5, color: "#5A6B7E", marginTop: 12 }}>
          보고PASS 데모 · 이 브라우저에 데이터가 저장됩니다 (기기별 독립)
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
