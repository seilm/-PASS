<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보고PASS</title>

<style>
/* =====================================================
   보고PASS — CLEAN PREMIUM THEME
   기존 기능은 그대로 / 디자인만 새로 적용
   ===================================================== */

* {
  box-sizing: border-box;
}

:root {
  --bg: #F6F8FB;
  --white: #FFFFFF;

  --navy: #172033;
  --navy-2: #344054;

  --blue: #2563EB;
  --blue-hover: #1D4ED8;
  --blue-soft: #EFF6FF;

  --green: #16A37A;
  --green-soft: #ECFDF5;

  --red: #DC3E4D;
  --red-soft: #FEF2F2;

  --amber: #C98A00;
  --amber-soft: #FFF8E7;

  --text: #172033;
  --text-2: #475467;
  --muted: #98A2B3;

  --border: #E7ECF2;
  --border-2: #D7DEE8;

  --radius: 12px;
  --radius-lg: 16px;

  --shadow:
    0 2px 8px rgba(16,24,40,.04),
    0 8px 24px rgba(16,24,40,.04);

  --shadow-hover:
    0 8px 28px rgba(16,24,40,.08);
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);

  font-family:
    Pretendard,
    "Noto Sans KR",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  overflow-x: hidden;
}

#root {
  min-height: 100vh;
}

/* ---------- 기본 ---------- */

button,
input,
textarea,
select {
  font-family: inherit;
}

button {
  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease,
    box-shadow .15s ease,
    transform .12s ease,
    opacity .15s ease;
}

button:not(:disabled):active {
  transform: translateY(1px);
}

button:not(:disabled):hover {
  filter: brightness(.985);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

input,
textarea,
select {
  color: var(--text);
  background: #fff;
  border-color: var(--border-2);
  border-radius: 9px;
}

input:focus,
textarea:focus,
select:focus {
  outline: none !important;
  border-color: var(--blue) !important;
  box-shadow: 0 0 0 3px rgba(37,99,235,.10) !important;
}

input::placeholder,
textarea::placeholder {
  color: #AAB3C0;
}

/* ---------- 텍스트 ---------- */

h1,
h2,
h3,
h4,
h5,
h6 {
  color: var(--navy);
  letter-spacing: -.025em;
}

/* ---------- 기존 베이지 자동 제거 ---------- */

[style*="#F8F4EC"],
[style*="#F7F5F0"],
[style*="#F0EDE4"],
[style*="#EFEDE7"],
[style*="#FDF3EA"],
[style*="#FFF1EA"] {
  background-color: var(--bg) !important;
}

[style*="#E4E2DC"],
[style*="#E2DED4"] {
  border-color: var(--border) !important;
  background-color: var(--border) !important;
}

[style*="#9A9689"],
[style*="#A6A192"],
[style*="#8D8A7E"],
[style*="#8A8578"],
[style*="#B0ABA0"] {
  color: var(--muted) !important;
}

/* ---------- 기존 오렌지 자동 제거 ---------- */

[style*="#FF7A45"] {
  background-color: var(--blue) !important;
  border-color: var(--blue) !important;
  color: #fff !important;
}

[style*="#E85F2A"] {
  color: var(--blue-hover) !important;
}

[style*="#FDF3EA"] {
  background-color: var(--blue-soft) !important;
}

/* ---------- 기존 녹색 ---------- */

[style*="#2E8B72"] {
  color: var(--green) !important;
}

/* ---------- 카드 ---------- */

[class*="card"],
[class*="Card"],
[class*="panel"],
[class*="Panel"] {
  border-color: var(--border) !important;
}

/* ---------- 둥근 박스 ---------- */

[style*="borderRadius: 10"],
[style*="borderRadius: 11"],
[style*="borderRadius: 12"],
[style*="borderRadius: 14"] {
  box-shadow: var(--shadow);
}

/* ---------- 탭 ---------- */

[role="tab"] {
  color: var(--text-2);
}

[role="tab"][aria-selected="true"] {
  color: var(--blue) !important;
}

/* ---------- 상태 ---------- */

.bg-blue-100 {
  background: var(--blue-soft) !important;
}

.text-blue-700 {
  color: var(--blue-hover) !important;
}

.bg-green-100,
.bg-emerald-100 {
  background: var(--green-soft) !important;
}

.text-green-700,
.text-emerald-700 {
  color: #047857 !important;
}

.bg-yellow-100,
.bg-amber-100 {
  background: var(--amber-soft) !important;
}

.text-yellow-700,
.text-amber-700 {
  color: #A16207 !important;
}

/* ---------- 모달 ---------- */

[role="dialog"] {
  border-radius: var(--radius-lg) !important;
  border: 1px solid var(--border) !important;
  box-shadow: 0 20px 60px rgba(16,24,40,.14) !important;
}

/* ---------- 링크 ---------- */

a {
  color: var(--blue);
  text-decoration: none;
}

/* ---------- 스크롤 ---------- */

::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #D3DAE4;
  border-radius: 999px;
}

::-webkit-scrollbar-thumb:hover {
  background: #B8C3D1;
}

::selection {
  background: #DBEAFE;
  color: var(--navy);
}

/* =====================================================
   핵심:
   원본 HTML을 불러온 뒤 기존 style 태그는 제거하고
   위 디자인을 다시 적용한다.
   ===================================================== */
</style>
</head>

<body>

<div id="root"></div>

<script>
(async function () {

  /*
   * 원본 앱.
   *
   * 기존 GitHub 파일에는
   * - React
   * - Supabase
   * - 조직 데이터
   * - 로그인
   * - 보고자 모드
   * - 결재자 모드
   * - 대기열
   * - 우선PASS
   * - AI 보정
   * - 일정
   * 등이 이미 구현되어 있다.
   *
   * 이 파일에서는 그 기능을 다시 만들지 않고
   * 원본 앱을 가져와 디자인만 정리한다.
   */

  const SOURCE =
    "https://raw.githubusercontent.com/selimpower/-PASS/main/index.html";

  try {

    const response = await fetch(
      SOURCE + "?v=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("원본 앱을 불러오지 못했습니다.");
    }

    let html = await response.text();

    /*
     * 원본의 <style>들을 제거한다.
     * 현재 원본에는 기본 CSS 외에도
     * Premium Theme와 Blue Theme가 중복되어 있다.
     */
    html = html.replace(
      /<style[\s\S]*?<\/style>/gi,
      ""
    );

    /*
     * 기존 HTML의 body 안에서
     * 앱 실행에 필요한 script만 가져온다.
     */
    const scripts = [
      ...html.matchAll(
        /<script\b[^>]*>[\s\S]*?<\/script>/gi
      )
    ].map(x => x[0]);

    /*
     * 원본 body에서 script를 제외한 HTML.
     */
    let bodyHtml = html
      .replace(
        /<script\b[^>]*>[\s\S]*?<\/script>/gi,
        ""
      )
      .replace(
        /<!DOCTYPE[^>]*>/gi,
        ""
      )
      .replace(
        /<html[^>]*>|<\/html>|<head[\s\S]*?<\/head>|<body[^>]*>|<\/body>/gi,
        ""
      );

    /*
     * 원본 body를 현재 페이지에 삽입.
     */
    document.body.insertAdjacentHTML(
      "afterbegin",
      bodyHtml
    );

    /*
     * 원본 script들을 순서대로 실행.
     *
     * React / ReactDOM / Babel / Supabase
     * 로딩 순서를 그대로 유지한다.
     */
    for (const oldScript of scripts) {

      const temp = document.createElement("div");
      temp.innerHTML = oldScript;

      const sourceScript =
        temp.querySelector("script");

      if (!sourceScript) continue;

      const script =
        document.createElement("script");

      for (
        const attr of sourceScript.attributes
      ) {
        script.setAttribute(
          attr.name,
          attr.value
        );
      }

      script.textContent =
        sourceScript.textContent;

      document.body.appendChild(script);
    }

  } catch (error) {

    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        background:#F6F8FB;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      ">
        <div style="
          max-width:420px;
          width:100%;
          background:#fff;
          border:1px solid #E7ECF2;
          border-radius:16px;
          padding:32px;
          box-shadow:
            0 10px 35px rgba(16,24,40,.08);
          text-align:center;
        ">
          <div style="
            width:48px;
            height:48px;
            margin:0 auto 18px;
            border-radius:14px;
            background:#EFF6FF;
            color:#2563EB;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
            font-weight:800;
          ">
            P
          </div>

          <h2 style="
            margin:0 0 8px;
            color:#172033;
            font-size:19px;
          ">
            보고PASS를 불러오지 못했어요
          </h2>

          <p style="
            margin:0;
            color:#667085;
            font-size:13px;
            line-height:1.6;
          ">
            잠시 후 다시 새로고침해주세요.
          </p>
        </div>
      </div>
    `;

    console.error(error);
  }

})();
</script>

</body>
</html>
